<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Rock, Paper, Scissors</title>
	</head>
	<body>
		<p>Welcome to the Rock, Paper, Scissors game!</p>
		

		<div class="container" style="display: flex; justify-content: left; gap: 10px; margin-top: 20px;">
			<button id="rock">Rock</button>
			<button id="paper">Paper</button>
			<button id="scissors">Scissors</button>
		</div>

		<script>
      const rockButton = document.getElementById('rock');
      const paperButton = document.getElementById('paper');
      const scissorsButton = document.getElementById('scissors');

			
			let computerMove = "";
			console.log(computerMove)

      function getComputerMove() {
        const randomNumber = Math.random();

				if (randomNumber >= 0 && randomNumber <= 1 / 3) {
					computerMove = 'rock';
				} else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
					computerMove = 'paper';
				} else if (randomNumber >= 2 / 3 && randomNumber < 1) {
					computerMove = 'scissor';
				}
				console.log(computerMove);
				return computerMove;
			}	
				
				
      

      rockButton.addEventListener('click', () => {
        getComputerMove();
        let result = '';
				console.log(`This is the compurter choice: "${computerMove}"`)

				if (computerMove === 'rock') {
					result = 'Tie!';
          
				} else if (computerMove === 'paper') {
					result = 'You Lose!';
         
				} else if (computerMove === 'scissor') {
					result = 'You Win!';
          
				}
        alert(
					`You picked Rock. The computer picked ${computerMove}. ${result}`
				);
        
      })

      paperButton.addEventListener('click', () => {
        getComputerMove();
				let result = '';

				if (computerMove === 'paper') {
					result = 'Tie!';
          
				} else if (computerMove === 'scissor') {
					result = 'You Lose!';
         
				} else if (computerMove === 'rock') {
					result = 'You Win!';
          
				}
        alert(
					`You picked Paper. The computer picked ${computerMove}. ${result}`
				);
      })

      scissorsButton.addEventListener('click', () => {
        getComputerMove();  
				let result = '';

				if (computerMove === 'scissor') {
					result = 'Tie!';
          
				} else if (computerMove === 'rock') {
					result = 'You Lose!';
         
				} else if (computerMove === 'paper') {
					result = 'You Win!';
          
				}
        alert(
					`You picked Scissor. The computer picked ${computerMove}. ${result}`
				);
      })
    </script>
	</body>
</html>
