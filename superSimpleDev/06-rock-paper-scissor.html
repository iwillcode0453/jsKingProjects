<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Rock, Paper, Scissors</title>
	</head>
	<body>
		<p>Welcome to the Rock, Paper, Scissors game!</p>

		
			<p id="showHands"></p>
			<button id="rock" onclick="determineWinner('rock')">Rock</button>
			<button id="paper" onclick="determineWinner('paper')">Paper</button>
			<button id="scissors" onclick="determineWinner('scissors')">
				Scissors
			</button>
			<button id="resetGame" onclick="playAgain()">Play again!</button>
			<p id="showWinner">Hi</p>
		

		<script>
			const hands = ["rock", "paper", "scissors"];
			const rockButton = document.getElementById("rock");
			const paperButton = document.getElementById("paper");
			const scissorsButton = document.getElementById("scissors");
			const handsDisplay = document.getElementById("showHands");
			const winnerContainer = document.getElementById("showWinner");
			const resetGame = document.getElementById("resetGame");

			function getComputerMove() {
				const randomNumber = Math.floor(Math.random() * hands.length);
				return hands[randomNumber];
			}

			// Determine Winner function
			function determineWinner(parameter1) {
				let computerMove = getComputerMove();
				handsDisplay.textContent = `You chose ${parameter1} and computer chose ${computerMove}`;

				if (computerMove === parameter1) {
					winnerContainer.textContent = "It's a tie!";
				} else if (
					(computerMove === "rock" && parameter1 === "scissors") ||
					(computerMove === "paper" && parameter1 === "rock") ||
					(computerMove === "scissors" && parameter1 === "paper")
				) {
					winnerContainer.textContent = "Computer wins!";
				} else {
					winnerContainer.textContent = "You win!";
				}
			}

			// RESET GAME function
			function playAgain() {
				handsDisplay.textContent = "";
				winnerContainer.textContent = "";
			}
		</script>
	</body>
</html>
